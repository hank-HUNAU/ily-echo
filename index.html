<script>
/* ================= 状态与存储层 ================= */
if(window.__EL2_GATE__==='deny'){ /* 已被门禁拦下，跳过初始化 */ }
else
{
const LS='el2_';
const OFFSETS=[0.25,1,2,4,7,21,60];          // 7 轮复习（天）：6小时→1→2→4→7→21→60 天（11-21 定稿 60 天版）
const STAGES=['盲听','精听','跟读'];      /* 11-23 用户定：删录音段，三段 + 学习完成卡 */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>(n<10?'0':'')+n;
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
const isoOf=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
const fmtDate=s=>{if(!s)return'';const p=String(s).slice(0,10).split('-');return (+p[1])+'月'+(+p[2])+'日';};

const store={
  get(){ try{return JSON.parse(localStorage.getItem(LS+'progress')||'{}');}catch(e){return{};} },
  set(p){ localStorage.setItem(LS+'progress',JSON.stringify(p)); },
  getHard(){ try{return JSON.parse(localStorage.getItem(LS+'hard')||'[]');}catch(e){return[];} },
  setHard(a){ localStorage.setItem(LS+'hard',JSON.stringify(a)); },
  getStats(){ try{return JSON.parse(localStorage.getItem(LS+'stats')||'{}');}catch(e){return{};} },
  setStats(s){ localStorage.setItem(LS+'stats',JSON.stringify(s)); },
};
/* ===== 进度存储 v3：按课程分组 {_v:3, courses:{nce2:{"1":{…}}}} =====
   v3 前是扁平 {课号:记录}——第二门课一接入就会与 NCE2 同课号写成同一条记录（静默互串）。
   迁移在读取时做一次，对同一份旧数据幂等；旧数据全部归属默认课程。 */
const DEF_COURSE='nce2';
function blankProg(){ return {stage:0,si:0,listened:{},shadow:{},hard:[],firstLearnAt:0,reviews:0,lastReviewAt:0,blindDone:false,retellDone:false,revDone:null,revMiss:0}; }
function migrateProg(raw){
  if(!raw||typeof raw!=='object') return {_v:4,courses:{}};
  if(raw._v===3||raw._v===4){
    /* 兜底：旧版 JS（缓存未更新）仍按扁平结构写入时，把它并回默认课程，别丢数据 */
    const stray=Object.keys(raw).filter(k=>/^\d+$/.test(k));
    if(stray.length){
      const o=raw.courses[DEF_COURSE]||(raw.courses[DEF_COURSE]={});
      stray.forEach(k=>{ o[k]=raw[k]; delete raw[k]; });
    }
    /* v4 顺序迁移：旧[盲听0,跟读1,精听2,复述3] → 新[盲听0,精听1,跟读2,录音3]，stage 1↔2 互换。
       幂等：靠 __v4 标记，只跑一次；stage 0/3 语义不变（盲听/末段）。 */
    if(!raw.__v4){
      for(const cid in raw.courses){ const c=raw.courses[cid];
        if(!c||typeof c!=='object') continue;
        for(const k in c){ const q=c[k];
          if(q&&typeof q.stage==='number'){ if(q.stage===1)q.stage=2; else if(q.stage===2)q.stage=1; }
        }
      }
      raw.__v4=1;
    }
    raw._v=4;
    return raw;
  }
  const inner={};
  for(const k in raw){ if(/^\d+$/.test(k)&&raw[k]&&typeof raw[k]==='object') inner[k]=raw[k]; }
  /* 先补跑 v2 顺序迁移：旧顺序[精听0,跟读1,盲听2,复述3] → 新顺序[盲听0,跟读1,精听2,复述3] */
  if(!raw.__v2){ for(const k in inner){ const q=inner[k];
    if(typeof q.stage==='number'){ if(q.stage===0)q.stage=2; else if(q.stage===2)q.stage=0; } } }
  /* v4：再跑 stage 1↔2 互换（跟读↔精听）→ 盲听0/精听1/跟读2/录音3 */
  for(const k in inner){ const q=inner[k];
    if(typeof q.stage==='number'){ if(q.stage===1)q.stage=2; else if(q.stage===2)q.stage=1; } }
  return {_v:4,__v4:1,courses:{[DEF_COURSE]:inner}};
}
let PROG=migrateProg(store.get());
try{ store.set(PROG); }catch(e){}
let STATS=Object.assign({playSec:0,shadowN:0,recN:0,days:{}},store.getStats());
function saveProgress(){ store.set(PROG); }
function saveStats(){ store.setStats(STATS); }
/* 当前课程：接入第二门课时由路由写入 CUR.course；现在恒为 nce2 */
function curCourse(){ return (CUR&&CUR.course)||DEF_COURSE; }
function progOf(cid){
  cid=cid||curCourse();
  if(!PROG.courses) PROG.courses={};
  if(!PROG.courses[cid]) PROG.courses[cid]={};
  return PROG.courses[cid];
}
function prog(no,cid){ const o=progOf(cid), k=String(no);
  if(!o[k]) o[k]=blankProg(); return o[k]; }
/* ===== 复习 7 轮：本轮两段有效提取（11-23 删录音段后） =====
   revDone 只对「当前轮」有效，换轮自动重置；seen 记录精听已走过的句卡，跨会话保留。
   两段齐了才 reviews+1 —— 不允许「点一次就记账」。 */
const REV_STEPS=['精听','跟读'];           /* 11-23：复习随首学改为两段 */
const REV_GRACE_MS=3*864e5;                    /* 3 天宽限内补做不算漏 */
function revState(p){
  const r=(p.reviews||0)+1;
  if(!p.revDone||typeof p.revDone!=='object'||p.revDone.r!==r) p.revDone={r:r,s:[false,false],seen:{}};
  if(!Array.isArray(p.revDone.s)||p.revDone.s.length!==REV_STEPS.length) p.revDone.s=[false,false];
  if(!p.revDone.seen||typeof p.revDone.seen!=='object') p.revDone.seen={};
  return p.revDone;
}
function revMark(i){ const p=prog(CUR.no); const st=revState(p); if(!st.s[i]){ st.s[i]=true; saveProgress(); } return st; }
function revMissing(p){
  const st=revState(p), m=[];
  st.s.forEach((v,i)=>{ if(!v) m.push(REV_STEPS[i]); });
  return m;
}
/* 本轮收尾：三段齐了才 reviews+1；超 3 天宽限记未通关；随后进屏 8 */
function finishReview(){
  const p=prog(CUR.no);
  const st=revState(p);
  const miss=[];
  st.s.forEach((v,i)=>{ if(!v) miss.push(REV_STEPS[i]); });
  if(miss.length){ toast('本轮还差：'+miss.join(' / ')); CUR.rstep=Math.max(0,st.s.findIndex(v=>!v)); renderLesson(); return false; }
  const due=nextDue(p);                       /* 必须在 reviews+1 之前算 */
  const late=!!due&&(Date.now()-due>REV_GRACE_MS);
  const snap=st.s.slice();
  p.reviews=Math.min((p.reviews||0)+1,OFFSETS.length);
  p.lastReviewAt=Date.now();
  if(late) p.revMiss=(p.revMiss||0)+1;
  p.revDone=null;                             /* 换轮重置 */
  saveProgress();
  syncEnqueue('review',0,null);
  CUR.revDoneShown={round:p.reviews,s:snap,late:late};
  CUR.rstep=null;                             /* 11-23：录音段已删，屏 8 不再有分享录音 */
  renderLesson();
  return true;
}
/* 单课程汇总：已学 / 通关 / 复习轮数 / 最近课号 / 继续目标 */
function progStat(cid){
  const o=progOf(cid), ks=Object.keys(o);
  let learned=0,done=0,rounds=0,best=-1,cont=0,last=0;
  ks.forEach(k=>{ const p=o[k]||{}; const sc=(p.stage||0)*100+(p.si||0);
    if(sc>best){best=sc;cont=+k;}
    if(p.firstLearnAt){ learned++; if(p.reviews>=OFFSETS.length) done++; rounds+=(p.reviews||0);
      if(+k>last) last=+k; } });
  return {learned,done,rounds,cont,last};
}
function progStatAll(){
  const a={learned:0,done:0,rounds:0};
  const ids=(typeof myCourses==='function')?myCourses():Object.keys(PROG.courses||{});
  ids.forEach(c=>{ const s=progStat(c); a.learned+=s.learned; a.done+=s.done; a.rounds+=s.rounds; });
  return a;
}
/* 最近一次学习时间（跨课程排序用）：取该课进度里最大的 firstLearnAt */
function lastAt(cid){
  const o=(PROG.courses||{})[cid]||{}; let t=0;
  for(const k in o){ const p=o[k]||{}; if(p.firstLearnAt&&p.firstLearnAt>t) t=p.firstLearnAt; }
  return t;
}
/* 难句/卡片 的课程范围（内存态，不持久化）——方案 C：跟随 + 状态外显
   规则：
   · 从课程页（#/c/:id）或课文页（#/lesson/N?c=）进来 → 默认选中那门课
   · 从课程中心/课程库/冷启动进来 → 默认「全部」
   · 在「难句 ↔ 卡片」之间来回切 → 沿用当前选择，不打断刚做的筛选
   筛选条出现条件：有 ≥2 门课有难句，或已选中某门课（保证单课程时也能切回「全部」） */
let HARDF='all', LAST_HASH='';
function scopeOnEnter(){
  const prev=LAST_HASH||'';
  if(prev.startsWith('#/hard')||prev.startsWith('#/cards')) return;
  if(prev.startsWith('#/c/')){ HARDF=decodeURIComponent(prev.slice(4).split('?')[0])||DEF_COURSE; return; }
  if(prev.startsWith('#/lesson/')){ const Q=hashQs(); HARDF=Q.c||CUR.course||curCourse()||DEF_COURSE; return; }
  HARDF='all';
}
function hardList(){
  const a=hardAll();
  return HARDF==='all'?a:a.filter(x=>(x.cid||DEF_COURSE)===HARDF);
}
function hardChips(){
  const a=hardAll();
  const cids=[...new Set(a.map(x=>x.cid||DEF_COURSE))];
  if(cids.length<2 && HARDF==='all') return '';          /* 单课程且未筛选 → 不制造无意义控件 */
  if(HARDF!=='all' && cids.indexOf(HARDF)<0) cids.push(HARDF);  /* 选中的课暂时没难句也要能切回来 */
  const cnt=id=>a.filter(x=>(x.cid||DEF_COURSE)===id).length;
  const chip=(v,label,n)=>`<button class="hchip${HARDF===v?' on':''}" data-act="hardf" data-v="${v}">${label}<i>${n}</i></button>`;
  return `<div class="hchips">${chip('all','全部',a.length)}`+
    cids.map(id=>{ const c=catCourse(id)||{}; return chip(id,c.short||id,cnt(id)); }).join('')+`</div>`;
}
/* 难句本：v3 前没有 cid 字段（只可能是 NCE2），读取时补默认课程 */
function hardAll(){
  const a=store.getHard(); let ch=false;
  a.forEach(x=>{ if(!x.cid){ x.cid=DEF_COURSE; ch=true; } });
  if(ch){ try{ store.setHard(a); }catch(e){} }
  return a;
}

/* 复习调度：nextDue(no) → 毫秒时间戳；dueRound(no) → 第几轮(1-7) 或 0 */
function nextDue(p){
  if(!p.firstLearnAt||p.reviews>=OFFSETS.length) return 0;
  return p.firstLearnAt+OFFSETS[p.reviews]*864e5;
}
/* cid 省略 = 全部课程（首页聚合）；给了就只看这一门 */
function dueList(cid){
  const now=Date.now(),out=[];
  const cs=cid?[cid]:((typeof myCourses==='function')?myCourses():Object.keys(PROG.courses||{}));
  cs.forEach(c=>{ const o=(PROG.courses||{})[c]||{};
    for(const k in o){ const p=o[k];
      if(!p.firstLearnAt) continue;
      const nd=nextDue(p);
      if(nd&&now>=nd) out.push({cid:c,no:+k,round:p.reviews+1,due:nd,overdueDays:Math.floor((now-nd)/864e5)});
    } });
  out.sort((a,b)=>a.due-b.due); return out;
}

/* 统计 */
function statDay(sec){ const d=todayStr(); STATS.playSec=(STATS.playSec||0)+sec;
  STATS.days[d]=(STATS.days[d]||0)+sec; saveStats();
  try{ const st=['intensive','shadow','blind','retell'];
    const idx=(CUR.mode==='rev')?(CUR.rstep||0):((prog(CUR.no).stage)||0);
    syncEnqueue(st[idx]||'intensive',sec,null); }catch(e){} }

/* ================= 云同步（Supabase el2_events，纯匿名静默上报；无登录、无家庭码、无 token） ================= */
const SYNC_URL='https://zwatrfbqkrvxpqtypdgx.supabase.co/rest/v1/el2_events';
const SYNC_KEY='sb_publishable_mnkBBrHF70guvwfUNXuhBg_sIok8eBc';
const SYNC_Q='el2_sync_q';
function syncDid(){ let d=localStorage.getItem('el2_did');
  if(!d){ d='did-'+Math.random().toString(36).slice(2,10)+Date.now().toString(36); localStorage.setItem('el2_did',d); }
  return d; }
function syncEnqueue(stage,duration_s,self_rating){
  try{
    if(!(CUR.no>=1&&CUR.no<=96)) return;
    const q=JSON.parse(localStorage.getItem(SYNC_Q)||'[]');
    q.push({device_id:syncDid(),lesson_no:CUR.no,stage,duration_s:Math.max(0,Math.round(duration_s||0)),
      self_rating:self_rating||null,occurred_at:new Date().toISOString(),client_date:todayStr()});
    while(q.length>500) q.shift();
    localStorage.setItem(SYNC_Q,JSON.stringify(q));
    clearTimeout(window.__syncT); window.__syncT=setTimeout(syncFlush,8000);
  }catch(e){}
}
async function syncFlush(){
  let q=[]; try{ q=JSON.parse(localStorage.getItem(SYNC_Q)||'[]'); }catch(e){}
  if(!q.length||!navigator.onLine) return;
  const batch=q.slice(0,50);
  try{
    const r=await fetch(SYNC_URL,{method:'POST',
      headers:{'apikey':SYNC_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},
      body:JSON.stringify(batch)});
    if(r.ok){ localStorage.setItem(SYNC_Q,JSON.stringify(q.slice(batch.length))); }
    /* 失败/被拒 → 队列保留待下轮重试 */
  }catch(e){} /* 失败保留队列，下轮重试 */
}
setInterval(syncFlush,60000);
window.syncFlush=syncFlush; /* 供调试/验收脚本触发 */
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) syncFlush(); });

/* ================= 录音（IndexedDB：每句保留最新一条） ================= */
let IDB=null;
function idb(){ if(IDB) return Promise.resolve(IDB);
  return new Promise((res,rej)=>{
    const rq=indexedDB.open('el2rec',1);
    rq.onupgradeneeded=()=>rq.result.createObjectStore('r');
    rq.onsuccess=()=>{IDB=rq.result;res(IDB);}; rq.onerror=()=>rej(rq.error);
  });
}
async function recSave(key,blob){ try{ const db=await idb();
  await new Promise((res,rej)=>{const tx=db.transaction('r','readwrite');tx.objectStore('r').put(blob,key);tx.oncomplete=res;tx.onerror=rej;});
}catch(e){} }
async function recLoad(key){ try{ const db=await idb();
  return await new Promise((res)=>{const tx=db.transaction('r','readonly');const q=tx.objectStore('r').get(key);
    q.onsuccess=()=>res(q.result||null); q.onerror=()=>res(null);});
}catch(e){ return null; } }

/* ================= 音频引擎 ================= */
const AU=$('#au'); let segStop=null,playT0=0;
function audioSrcOf(a){ return /^audio\//.test(a) ? a : 'audio/'+a; }
function curAudio(){ return audioSrcOf((CUR.data||{}).audio); }
function playSeg(t,t2,onend,src){
  AU.src=src||curAudio(); AU.currentTime=t; AU.play();
  playT0=Date.now();
  if(segRaf){ cancelAnimationFrame(segRaf); segRaf=null; }
  if(segStop) AU.removeEventListener('timeupdate',segStop);
  /* rAF 轮询（~16ms）替代 timeupdate（~250ms）：句尾过冲从 0.25s 降到 0.02s，
     避免下一句起音漏进本句（L1 "interesting."/"I" 边界实测余量仅 0.12s） */
  const step=()=>{
    if(AU.paused){ segRaf=null; return; }
    if(AU.currentTime>=t2){
      AU.pause(); segRaf=null;
      statDay((Date.now()-playT0)/1000); if(onend)onend();
      return;
    }
    segRaf=requestAnimationFrame(step);
  };
  segRaf=requestAnimationFrame(step);
}
let segRaf=null;
function playAll(onend){ AU.src=curAudio(); AU.currentTime=0; AU.play(); playT0=Date.now();
  if(segRaf){ cancelAnimationFrame(segRaf); segRaf=null; }
  if(segStop) AU.removeEventListener('timeupdate',segStop);
  segStop=()=>{ if(AU.ended){ AU.removeEventListener('timeupdate',segStop); statDay((Date.now()-playT0)/1000); if(onend)onend(); } };
  AU.addEventListener('timeupdate',segStop);
}

  let used=0, n=0;

  navigator.storage.estimate().then(ev=>{
    const free=Math.round(((ev.quota||0)-(ev.usage||0))/1048576);
    el.innerHTML=dot+(n?`离线 ${n} 门 · 已用 ${used}MB`:'暂无离线课程')+(free>0?` · 设备可用 ${free>=1024?(free/1024).toFixed(1)+'GB':free+'MB'}`:'');

function renderStage(){
  const p=prog(CUR.no), d=CUR.data, rev=CUR.mode==='rev';
  const el=$('#stage');
  const step=rev?CUR.rstep:p.stage;
  if(rev){
    /* 复习两段：精听 → 跟读（无盲听、无难句补练） */
    el.innerHTML=[stageIntensive,stageShadow][step]();
  }else if(step>=STAGES.length){
    el.innerHTML=studyDoneCard();                /* 学习完成卡：三段走完的终点 */
    return;
  }else{
    el.innerHTML=[stageBlind,stageIntensive,stageShadow][step]();
  }
  /* 盲听首学：渲染后自动启动无字播放（同一 phase 只启动一次） */
  if(!rev && step===0 && CUR.blind && CUR.blind.phase==='playing' && !CUR.blindStarted){
    CUR.blindStarted=true; blindStart();
  }
  /* 精听：绑定卡片左右手势；复习轮记录已走过的句卡（精听段的有效提取判据） */
  if((!rev&&step===1)||(rev&&step===0)){
    bindIntGesture();
    if(rev&&CUR.intSi!=null){
      const st=revState(p);
      if(!st.seen[CUR.intSi]){ st.seen[CUR.intSi]=1; saveProgress(); }
    }
  }
  /* 跟读：把焦点行滚到容器中部（录音段已删） */
  const isShadow=(!rev&&step===2)||(rev&&step===1);
  if(isShadow){
    const ks=document.getElementById('kstage'), now=ks&&ks.querySelector('.krow.now');
    if(ks&&now){ try{ ks.scrollTop=now.offsetTop-ks.clientHeight/2+now.offsetHeight/2; }catch(e){} }
  }
  if(CUR.afterRender){ const f=CUR.afterRender; CUR.afterRender=null; f(); }
}
/* —— 精听：Anki 句卡 + 左右手势切卡（P2-2） —— */
function stageIntensive(){
  const p=prog(CUR.no), d=CUR.data;
  /* sentences[0] 是题干/标题，不算课文句子：句卡从 1 开始，显示口径＝正文句数 */
  const last=Math.max(1,d.sentences.length-1), body=Math.max(1,d.sentences.length-1);
  if(CUR.intSi==null||CUR.intSi<1||CUR.intSi>last) CUR.intSi=(p.si>=1&&p.si<=last)?p.si:1;
  if(!CUR.lang) CUR.lang='bi';   /* 中/英/双语，与跟读共用 */
  const i=CUR.intSi, s=d.sentences[i];
  const sEN=(CUR.lang==='zh')?'':`<div class="ankiEn">${esc(s.en)}</div>`;
  const sZH=(CUR.lang==='en')?'':`<div class="ankiZh">${esc(s.zh)}</div>`;
  const star=p.hard.includes(i)?' on':'';
  const heard=!!p.listened[i];
  /* 进度时间：优先用句子 t/t2，兜底展示总时长比例 */
  const pct=Math.round(i*100/body);
  const seg=(v,label)=>`<span class="${CUR.lang===v?'on':''}" data-act="intlang" data-v="${v}">${label}</span>`;
  return `<div class="int-wrap">
    <div class="int-card" id="intCard">
      <div class="ankiTop"><span class="ankiTag">句卡 ${i} / ${body}</span>

      <div class="ankiBody">${heard?'':''}${sEN}${sZH}</div>
      <div class="ankiFoot"><span>点播放听本句</span><span>${pad((p.reviews||0)+1)} / ${pad(OFFSETS.length)} 轮</span></div>
    </div>
    <div class="int-tip">← 左右滑动切句 →</div>
    <div class="int-bar">
      <div class="int-lang"><span class="seg">${seg('zh','中')}${seg('en','英')}${seg('bi','双语')}</span></div>
      <div class="int-prog"><div class="int-track"><i style="width:${pct}%"></i><b style="left:${pct}%"></b></div></div>
    </div>
    <div class="int-ctl">
      <button class="int-mini" data-act="intprev" aria-label="上一句"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5l-10 7 10 7z"/></svg></button>
      <button class="int-play" data-act="intplay" aria-label="播放本句"><svg viewBox="0 0 24 24" fill="#fff"><path d="M8 5l11 7-11 7z"/></svg></button>
      <button class="int-mini" data-act="intnext" aria-label="下一句"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5l10 7-10 7z"/></svg></button>
    </div>
    <div style="margin:14px 16px 0"><button class="btn" style="width:100%" data-act="tostage" data-v="${CUR.mode==='rev'?1:2}">进入跟读 →</button></div>
  </div>`;
}
/* 绑定精听卡片左右手势：仅横向位移超阈值生效 */
function bindIntGesture(){
  const card=document.getElementById('intCard'); if(!card) return;
  let x0=null,y0=null;
  card.addEventListener('touchstart',e=>{ const t=e.changedTouches[0]; x0=t.clientX; y0=t.clientY; },{passive:true});
  card.addEventListener('touchend',e=>{
    if(x0==null) return; const t=e.changedTouches[0];
    const dx=t.clientX-x0, dy=t.clientY-y0;
    if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)*1.4){ intStep(dx<0?1:-1); }
    x0=y0=null;
  },{passive:true});
}
function intStep(dir){
  const last=Math.max(1,CUR.data.sentences.length-1);
  const cur=(CUR.intSi>=1&&CUR.intSi<=last)?CUR.intSi:1;
  const ni=Math.max(1,Math.min(last,cur+dir));
  if(ni===cur) return;
  AU.pause(); CUR.intSi=ni;
  const p=prog(CUR.no); p.si=ni; saveProgress();
  renderStage();   /* 切卡后暂停并复位，不自动播放、不写 reviews */
}
function sentDetail(s){
  let h='';
  if(s.chunks) h+='<div style="margin:4px 0">'+s.chunks.map(c=>`<span class="ch">${esc(c.x)}<i>${esc(c.g||c.c)}</i></span>`).join('')+'</div>';
  if(s.pat) h+=`<div style="margin:4px 0"><span class="tag">${esc(s.pat)}</span>${(s.gp||[]).map(g=>`<span class="tag w">${esc(g)}</span>`).join('')}</div>`;
  if(s.zh) h+=`<div class="zh">${esc(s.zh)}</div>`;
  return h;
}
/* —— 跟读 —— */
function stageShadow(){
  const p=prog(CUR.no), d=CUR.data;
  /* 与精听同口径：sentences[0] 是题干，不进跟读正文 */
  const total=Math.max(1,d.sentences.length-1);
  if(CUR.shSi==null||CUR.shSi<1||CUR.shSi>total) CUR.shSi=(p.si>=1&&p.si<=total)?p.si:1;
  if(!CUR.lang) CUR.lang='bi';
  if(!CUR.loops || (CUR.loops!==1&&CUR.loops!==3)) CUR.loops=1;  /* 只 1↔3 两档 */
  const cur=CUR.shSi;
  let rows='';
  d.sentences.forEach((s,i)=>{
    if(i===0) return;                      /* 题干不入正文 */
    const now=i===cur, cls=now?'now':'dim';
    const en=(CUR.lang==='zh')?'':`<div class="en">${esc(s.en)}</div>`;
    const zh=(CUR.lang==='en')?'':`<div class="zh">${esc(s.zh)}</div>`;
    rows+=`<div class="krow ${cls}" data-act="shrow" data-i="${i}">${en}${zh}</div>`;
  });
  const segLang=['zh','en','bi'].map(v=>`<span class="${CUR.lang===v?'on':''}" data-act="intlang" data-v="${v}">${{zh:'中',en:'英',bi:'双语'}[v]}</span>`).join('');
  const segLoop=[1,3].map(n=>`<span class="${CUR.loops===n?'on':''}" data-act="loopsel" data-v="${n}">${n} 遍</span>`).join('');
  const pct=Math.round(cur*100/total);
  return `<div class="shadow-wrap">
    <div class="kstage" id="kstage">${rows}</div>
    <div class="kplayer">
      <button class="kplay" data-act="shplay" aria-label="播放/暂停"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5l11 7-11 7z"/></svg></button>
      <div class="ktrack"><i style="width:${pct}%"></i><b style="left:${pct}%"></b></div>
      <span class="ktime">${pad(cur)} / ${pad(total)}</span>
    </div>
    <div class="ktool">
      <div class="seg">${segLang}</div>
      <div class="seg">${segLoop}</div>
      <button class="fbtn sm" data-act="tostage" data-v="${CUR.mode==='rev'?2:3}">读完了 →</button>
    </div>
  </div>`;
}
/* 聚焦到跟读某句（滚动容器居中 + 不自动播放） */
function shFocus(i){

/* —— 盲听：无字播 1 遍 → 出题 → 答对直入/答错重听/再错揭底（11-18 拍板） —— */
function stageBlind(){
  const p=prog(CUR.no), d=CUR.data;
  if(!CUR.blind) CUR.blind={tries:0,showAnswer:false,phase:'playing',picked:-1};
  const B=CUR.blind;
  /* 进入即无字播 1 遍：只给一个大号聆听提示，不显示题干/选项/字幕/答案 */
  if(B.phase==='playing'){
    return `<div class="blind-wrap">
      <div class="blind-listen">

        <div class="blind-ttl">仔细听</div>
      </div>
    </div>`;
  }
  /* 出题态：题干 + 3 选项；答错重听后回到同一题 */
  return `<div class="blind-wrap" id="blindQuiz">
    <div class="blind-q">${esc((d.question&&d.question.en)||'')}</div>
    <div class="blind-opts" id="blindOpts">
      ${(CUR.blindOpt?CUR.blindOpt.options:[]).map((o,i)=>{
        let cls='blind-opt';
        if(B.showAnswer && i===CUR.blindOpt.correctIdx) cls+=' right';
        else if(B.picked===i && i!==CUR.blindOpt.correctIdx) cls+=' wrong';
        return `<button class="${cls}" data-act="blindpick" data-i="${i}"><b>${'ABC'[i]}</b><span>${esc(o)}</span></button>`;
      }).join('')}
    </div>
    ${B.showAnswer?`<div class="blind-reveal"><b>正确答案：${'ABC'[CUR.blindOpt.correctIdx]}</b> ${esc(CUR.blindOpt.options[CUR.blindOpt.correctIdx])}
      <div style="font-size:12px;color:var(--sub);margin-top:2px">${esc((CUR.blindOpt.zh||[])[CUR.blindOpt.correctIdx]||'')}</div></div>
      <button class="btn" style="width:100%;margin-top:10px" data-act="blind2jingting">进入精听 →</button>`:
      `<button class="btn ghost sm" style="display:block;margin:12px auto 0" data-act="blindhint">显示中文提示</button>
       <div class="blind-hint" id="blindHint" style="display:none">${esc((d.question&&d.question.zh)||'')}</div>`}
  </div>`;
}
/* 异步启动盲听播放：加载选项 → 无字播全文 → 播完出题 */

/* —— 交互（全局委托，事件→改状态→重渲染，渲染函数互不调用） —— */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const STT_AVAIL=!!SR;
let REC=null,RECCHUNKS=[];
function refreshStage(){ renderStage(); }

document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');
  if(!el) return;
  const act=el.dataset.act;
  /* 听单 / 播放页的动作不依赖已载入的课程：否则在 #/listen、#/player 上会被门禁整片挡掉 */
  const P4ACTS=['lbook','lview','lopen','packdl','plrtoggle','plrprev','plrnext','plrseek','plrfav',
                'plrcache','plrloop','plrsub','plrmore','plrpick','plrqplay','plrqclear',
                'tipq'];   /* tipq：难句/卡片/我的页的说明，CUR.data 为空时也要能点开 */
  const isP4=P4ACTS.indexOf(act)>=0;
  if(!CUR.data&&!isP4) return;
  const i=+el.dataset.i, p=isP4?null:prog(CUR.no), d=isP4?null:CUR.data;
  const cid=curCourse();
  const rev=CUR.mode==='rev';   /* P0 修复：rev 从未定义，plays 点击必抛 ReferenceError（自 f52a179 潜伏） */
  if(act==='plays'){
    const s=d.sentences[i];
    if(p.stage===1||el.closest('.shadow')){
      CUR.loopsLeft=CUR.loopsLeft??CUR.loops;
      const once=()=>{ CUR.loopsLeft--; const ll=$('#loopLeft'); if(ll) ll.textContent='剩 '+Math.max(CUR.loopsLeft,0)+' 遍';
        if(CUR.loopsLeft>0){ playSeg(s.t,s.t2,once); } else { CUR.loopsLeft=CUR.loops; } };
      playSeg(s.t,s.t2,once);
    }else{
      playSeg(s.t,s.t2);
    }
    const zz=$('#zh'+i); if(zz) zz.style.display='block';
        if(!rev){ p.si=i; if(CUR.si!=null)CUR.si=i; if(p.stage===2){ p.listened[i]=1; saveProgress(); const bt=el.closest('.sent'); if(bt&&bt.querySelector('.play'))bt.querySelector('.play').style.background='var(--accBtn)'; } else saveProgress(); }
    else saveProgress();
  }
  else if(act==='det'){ const z=$('#zh'+i),dt=$('#det'+i); if(z)z.style.display=z.style.display==='none'?'block':'none'; if(dt)dt.style.display=dt.style.display==='none'?'block':'none'; }
  else if(act==='star'){
    const arr=p.hard, ix=arr.indexOf(i);
    if(ix>=0){arr.splice(ix,1); store.setHard(hardAll().filter(x=>!(x.cid===cid&&x.no===CUR.no&&x.i===i)));}
    else{arr.push(i); const s=d.sentences[i]; const hard=hardAll(); hard.unshift({cid,no:CUR.no,i,en:s.en,zh:s.zh,pat:s.pat||'',ts:Date.now()}); store.setHard(hard);}
    saveProgress(); el.classList.toggle('on');
  }
  else if(act==='intlang'){ CUR.lang=el.dataset.v; renderStage(); }
  else if(act==='intprev'){ intStep(-1); }
  else if(act==='intnext'){ intStep(1); }
  else if(act==='intplay'){
    const s=d.sentences[CUR.intSi||0];
    playSeg(s.t,s.t2,()=>{ p.listened[CUR.intSi]=1; saveProgress(); syncEnqueue('intensive',0,null); });
  }
  else if(act==='loop'){ CUR.loops=+el.dataset.v; CUR.loopsLeft=CUR.loops; refreshStage(); }
  else if(act==='loopsel'){ CUR.loops=+el.dataset.v; renderStage(); }
  else if(act==='shrow'){ shFocus(+el.dataset.i); }
  else if(act==='shplay'){
    const s=d.sentences[CUR.shSi||0];
    CUR.loopsLeft=CUR.loops;
    const once=()=>{ CUR.loopsLeft--;
      if(CUR.loopsLeft>0){ playSeg(s.t,s.t2,once); }
      else{ CUR.loopsLeft=CUR.loops; p.shadow[CUR.shSi]=1; saveProgress(); syncEnqueue('shadow',0,null); }
    };
    once();
  }
  else if(act==='ps'){ if(CUR.si>0){CUR.si--;CUR.blob=null;CUR.grade='';refreshStage();} }
  else if(act==='ns'){ if(CUR.si<d.sentences.length-1){CUR.si++;CUR.blob=null;CUR.grade='';refreshStage();} }
  else if(act==='rate'){ p.shadow[CUR.si]=+el.dataset.v; STATS.shadowN=(STATS.shadowN||0)+1; saveProgress(); saveStats(); syncEnqueue('shadow',0,+el.dataset.v); refreshStage(); }
  else if(act==='aborig'){ const s=d.sentences[CUR.si??i]; playSeg(s.t,s.t2); }
  else if(act==='abmine'){ if(CUR.blob){ AU.pause(); AU.src=URL.createObjectURL(CUR.blob); AU.play(); } }
  else if(act==='rec'){
    if(REC&&REC.state==='recording'){ REC.stop(); return; }
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      RECCHUNKS=[]; REC=new MediaRecorder(stream);
      REC.ondataavailable=ev=>RECCHUNKS.push(ev.data);
      REC.onstop=()=>{
        stream.getTracks().forEach(t=>t.stop());
        CUR.blob=new Blob(RECCHUNKS,{type:REC.mimeType||'audio/webm'});
        const key=el.dataset.retell?`${cid}_${CUR.no}_retell`:`${cid}_${CUR.no}_s${CUR.si}`;
        recSave(key,CUR.blob);
        STATS.recN=(STATS.recN||0)+1; saveStats();
        el.textContent='● 录跟读'; el.classList.remove('recording');
        const rs=$('#recState'); if(rs)rs.textContent='已录 ✓（重新录会覆盖）';
        const bm=$('#btnMine'); if(bm)bm.disabled=false;
      };
      REC.start(); el.textContent='■ 停止'; el.classList.add('recording');
    }catch(err){ alert('麦克风不可用：'+err.message); }
  }
  else if(act==='stt'){
    if(!SR) return;
    const target=d.sentences[CUR.si].en, btn=$('#btnStt');
    btn.disabled=true; btn.textContent='聆听中…';
    try{
      const r=new SR(); r.lang='en-US'; r.interimResults=false; r.maxAlternatives=1;
      r.onresult=ev=>{ const said=ev.results[0][0].transcript;
        const norm=s=>s.toLowerCase().replace(/[^a-z' ]/g,'').split(/\s+/).filter(Boolean);
        const tw=norm(target), sw=new Set(norm(said));
        const hit=tw.filter(w=>sw.has(w)).length, ratio=hit/tw.length;
        const grade=ratio>=0.85?'A':ratio>=0.65?'B':'C';
        CUR.grade=`识别：「${said}」<br>命中 ${hit}/${tw.length} 词（${Math.round(ratio*100)}%）→ 评级 <b>${grade}</b>`;
        const g=$('#grade'); if(g)g.innerHTML=CUR.grade;
      };
      r.onerror=ev=>{ CUR.grade='识别失败（'+ev.error+'）。Chrome 识别需联网；Safari/iOS 暂不支持，请用自评。';
        const g=$('#grade'); if(g)g.textContent=CUR.grade; };
      r.onend=()=>{ btn.disabled=false; btn.textContent='识别评分'; };
      r.start();
    }catch(err){ btn.disabled=false; btn.textContent='识别评分'; }
  }
  else if(act==='tostage'){
    if(CUR.mode==='rev'){
      const v=+el.dataset.v, p0=prog(CUR.no), st=revState(p0);
      /* 精听 → 跟读：必须走过全部句卡，才算本段有效提取 */
      if(v===1){
        const total=Math.max(1,CUR.data.sentences.length-1), seen=Object.keys(st.seen||{}).length;
        if(seen<total){ toast(`还有 ${total-seen} 句没看，滑完再进跟读`); return; }
        revMark(0);
      }
      /* 跟读读完 → 两段齐，直接进入本轮完成卡（录音段已删） */
      if(v===2){ revMark(1); finishReview(); return; }
      CUR.rstep=v;
    }else{
      p.stage=+el.dataset.v; p.si=CUR.si??p.si;
      if(+el.dataset.v>=STAGES.length) p.firstLearnAt=p.firstLearnAt||Date.now();
      saveProgress();
    }
    CUR.grade=''; CUR.loopsLeft=null; renderLesson();
  }
  else if(act==='doneback'){
    p.firstLearnAt=p.firstLearnAt||Date.now(); p.stage=STAGES.length; saveProgress();
    location.hash='#/c/'+curCourse();
  }
  else if(act==='jump'){
    /* 四段条只读：设计稿 11-17 定稿，不可点自由切换 */
    return;
  }
  else if(act==='blindpick'){
    /* 点即判定，无提交按钮；不写对错内容，只记次数 */
    const B=CUR.blind, O=CUR.blindOpt;
    if(!O||B.showAnswer) return;
    B.tries++; B.picked=+el.dataset.i;
    STATS.blindN=(STATS.blindN||0)+1; saveStats();
    p.blindDone=true; saveProgress();
    if(B.picked===O.correctIdx){
      /* 答对 → 直入精听 */
      p.stage=1; saveProgress(); CUR.blind=null; CUR.blindStarted=false; renderLesson();
    }else if(B.tries>=2){
      /* 第 2 次仍错 → 揭底，等用户点「进入精听」 */
      B.showAnswer=true; renderStage();
    }else{
      /* 答错 → 自动再听 1 遍，回同一题重选（回调走统一入口） */
      B.picked=-1; B.phase='playing'; CUR.blindStarted=true; renderStage();

  else if(act==='blind2jingting'){ p.stage=1; saveProgress(); CUR.blind=null; CUR.blindStarted=false; renderLesson(); }
  else if(act==='retelldone'){ p.retellDone=el.checked; saveProgress(); syncEnqueue('retell',0,null); }
  else if(act==='fin'){
    p.firstLearnAt=Date.now(); p.stage=3; saveProgress(); renderLesson();
  }
  else if(act==='revbegin'){ CUR.rstep=0; CUR.revDoneShown=null; renderLesson(); }
  else if(act==='revlater'){ CUR.rstep=null; CUR.revDoneShown=null; location.hash='#/c/'+curCourse(); }
  else if(act==='revclose'){ CUR.rstep=null; CUR.revDoneShown=null; location.hash='#/c/'+curCourse(); }
  else if(act==='revfin'){ finishReview(); }
  /* —— 听单 / 播放页（P4） —— */
  else if(act==='lbook'){ LBOOK=el.dataset.c; LVIEW='recent'; renderListen(); }
  else if(act==='lview'){ LVIEW=el.dataset.v; renderListen(); }
  else if(act==='lopen'){ location.hash='#/player?c='+el.dataset.c+'&n='+el.dataset.n; }
  else if(act==='packdl'){ const cc=catCourse(el.dataset.c); if(cc) packDl(cc,el.dataset.lv); }
  else if(act==='plrtoggle'){ plrToggle(); }
  else if(act==='plrprev'){ plrStep(-1); }
  else if(act==='plrnext'){ plrStep(1); }
  else if(act==='plrseek'){ plrSeek(el,e.clientX); }
  else if(act==='plrfav'){ favToggle(PLR.cid,PLR.no); renderPlayer(); }
  else if(act==='plrcache'){ plrCacheAudio(); }
  else if(act==='plrloop'){ PLR.loop=!PLR.loop; plrSave(); renderPlayer(); }
  else if(act==='plrsub'){ PLR.sub=!PLR.sub; plrSave(); renderPlayer(); }
  else if(act==='plrmore'){ plrMore(); }
  else if(act==='plrpick'){ const k=el.dataset.k; if(PLR.picked[k]) delete PLR.picked[k]; else PLR.picked[k]=1; plrMore(true); }
  else if(act==='plrqplay'){ plrQueuePlay(); }
  else if(act==='plrqclear'){ PLR.picked={}; plrMore(true); }
  else if(act==='playall'){ playAll(); }
});

}
function renderHard(){

    return `<div class="item">

/* ================= 听单（泛听）· 屏 10 / 屏 11 =================
   P4 真实化：课本横滑（ready 门禁）+ 三胶囊三视图 + 正在听卡 + 离线音频包（课本 × 等级）
   + 全屏播放页（字幕逐句跟随 / 四操作 / 更多＝收藏复选×队列）。
   包 id = `{cid}:{level}`，只含 mp3；el2_pack 只记进度，图标一律实查 el2-content。 */
const FAVK='el2_fav', LPK='el2_listen', PACKK='el2_pack';
let LVIEW='recent', LBOOK='nce2', PACK_DL={};

/* —— 收藏（音频级，按 cid 分组防串课） —— */
function favAll(){ try{ const a=JSON.parse(localStorage.getItem(FAVK)||'[]'); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
function favSave(a){ try{ localStorage.setItem(FAVK,JSON.stringify(a)); }catch(e){} }
function favHas(cid,no){ return favAll().some(x=>x.cid===cid&&+x.no===+no); }
function favToggle(cid,no){
  const a=favAll(), i=a.findIndex(x=>x.cid===cid&&+x.no===+no);
  if(i<0) a.unshift({cid:cid,no:+no,at:Date.now()}); else a.splice(i,1);
  favSave(a); return i<0;
}
/* —— 聆听位置（正在听卡 / 播放页续播） —— */
function listenGet(){ try{ return JSON.parse(localStorage.getItem(LPK)||'null'); }catch(e){ return null; } }
function listenSet(v){ try{ if(v) localStorage.setItem(LPK,JSON.stringify(v)); else localStorage.removeItem(LPK); }catch(e){} }

/* —— 离线音频包：id=`{cid}:{level}`，键空间与 el2_dl 不重叠 —— */
function packMap(){ try{ return JSON.parse(localStorage.getItem(PACKK)||'{}'); }catch(e){ return {}; } }
function packSet(id,v){ const m=packMap(); if(v===null) delete m[id]; else m[id]=v;
  try{ localStorage.setItem(PACKK,JSON.stringify(m)); }catch(e){} }
function packId(cid,level){ return cid+':'+level; }
async function levelsOf(c){
  if(!c||!c.levels) return null;
  if(c.levels.__x) return c.levels.__x;
  const L=Object.assign({},c.levels);
  if(L.file){ try{ const r=await fetch(L.file,{cache:'force-cache'}); if(r&&r.ok) L.data=await r.json(); }catch(e){} }
  L.list=(L.list||[]).map(x=>typeof x==='string'?{level:x,src:L.src||'publisher'}:x);
  c.levels.__x=L; return L;
}
function packNoList(c,L,level){
  if(L&&L.mode==='perLesson'){
    const m=(L.data&&L.data.lessons)||{};
    return Object.keys(m).map(Number).filter(n=>m[String(n)]===level).sort((a,b)=>a-b);
  }
  const n=+c.lessons||0, out=[]; for(let i=1;i<=n;i++) out.push(i); return out;
}
function lessonAudio(c,no){ return (c.audioPat||'audio/L{NN}.mp3').replace('{NN}',String(no).padStart(c.pad||2,'0')); }
function lessonTitle(c,no){
  if(c.id===DEF_COURSE&&TITLES[no-1]) return TITLES[no-1];
  return 'L'+no;
}
/* 包信息（课数/时长/体积）与包内文件；派生：整本已下 → 包一律已下载 */
async function packInfo(c,level){
  const L=await levelsOf(c);
  const nos=packNoList(c,L,level);
  const pm=(L&&L.data&&L.data.packMeta&&L.data.packMeta[level])||null;
  return {id:packId(c.id,level),cid:c.id,level:level,src:(L&&L.src)||'publisher',
    nos:nos, files:nos.map(n=>lessonAudio(c,n)),
    lessons:pm?pm.lessons:nos.length,
    durSec:pm?pm.durSec:0, mb:pm?pm.mb:Math.round((c.sizeMB||0)*nos.length/Math.max(1,c.lessons||1)),
    label:(L&&L.label)||'官方等级'};
}
async function packStat(c,level){
  const P=await packInfo(c,level);
  const d=dlGet(c.id);
  if(c.ready&&d&&d.state==='done')
    return Object.assign(P,{state:'done',pct:100,hit:P.files.length,derived:true});
  let hit=0;
  try{ const cc=await caches.open(CACHE_CONTENT);
    for(const f of P.files){ if(await cc.match(f)) hit++; } }catch(e){}
  const total=Math.max(1,P.files.length);
  const rec=packMap()[P.id]||null;
  if(P.files.length&&hit>=P.files.length) return Object.assign(P,{state:'done',pct:100,hit:hit});
  if(rec&&rec.state==='run') return Object.assign(P,{state:'run',pct:rec.pct!=null?rec.pct:Math.round(hit*100/total),hit:hit});
  if(rec&&rec.state==='fail') return Object.assign(P,{state:'fail',pct:Math.round(hit*100/total),hit:hit});
  return Object.assign(P,{state:'idle',pct:Math.round(hit*100/total),hit:hit});
}
/* 单包下载：逐 mp3 落 el2-content，进度写 el2_pack，只就地刷这一行 */
async function packDl(c,level){
  const P=await packInfo(c,level);
  if(PACK_DL[P.id]) return;
  PACK_DL[P.id]=true;
  let hit=0;
  try{
    const cc=await caches.open(CACHE_CONTENT);
    packSet(P.id,{done:0,total:P.files.length,state:'run',pct:0});
    refreshPackRow(P.id);
    for(const f of P.files){
      const m=await cc.match(f);
      if(!m){ const r=await fetch(f); if(!r.ok) throw new Error('HTTP '+r.status); await cc.put(f,r); }
      hit++;
      const pct=Math.round(hit*100/Math.max(1,P.files.length));
      packSet(P.id,{done:hit,total:P.files.length,state:hit>=P.files.length?'done':'run',pct:pct});
      if(hit%2===0||hit===P.files.length) refreshPackRow(P.id);
    }
  }catch(e){
    packSet(P.id,{done:hit,total:P.files.length,state:'fail',pct:Math.round(hit*100/Math.max(1,P.files.length))});
    toast('音频包下载失败，点下载键重试');
  }finally{ delete PACK_DL[P.id]; refreshPackRow(P.id); }
}
async function refreshPackRow(id){
  const el=document.getElementById('pk-'+id.replace(':','_'));
  if(!el) return;
  const cid=id.split(':')[0], level=id.split(':')[1];
  const c=catCourse(cid); if(!c) return;
  const st=await packStat(c,level);
  if(el&&el.parentNode) el.outerHTML=packRowHTML(st);
}
function fmtDur(sec){
  sec=Math.round(sec||0);
  const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60;

}
function packRowHTML(P){

  else right=`<button class="ldl" data-act="packdl" data-c="${P.cid}" data-lv="${P.level}" aria-label="下载这一包"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M4 20h16"/></svg></button>`;
  const c=catCourse(P.cid)||{name:P.cid};
  return `<div class="lpack" id="pk-${P.id.replace(':','_')}"><div style="display:flex;align-items:center;gap:11px;padding:11px 13px;width:100%">
    ${bad}<div style="flex:1;min-width:0">
      <div style="font-size:13.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(c.name)}</div>
      <div style="font-size:11px;color:var(--sub);margin-top:1px">${P.lessons} 课 · ${fmtDur(P.durSec)} · ${P.mb} MB</div>

/* 全部可听包：只为 ready 且定义了 levels 的课程生成 */
async function allPacks(){
  const out=[];

    if(!c.ready||!c.levels) continue;

}

function plrScrollTo(si){
  const box=document.getElementById('plyrics'); if(!box) return;

function plrToggle(){

  if(AU.paused){ AU.src=plrAudioSrc(); AU.currentTime=PLR.pos||0; AU.play().catch(()=>{}); PLR.playing=true; plrSync(); }

function plrSync(){
  if(PLR.raf) cancelAnimationFrame(PLR.raf);
  const step=()=>{
    if(!PLR.playing||AU.paused){ PLR.raf=null; return; }
    const t=AU.currentTime||0;
    PLR.pos=t;
    const dur=AU.duration||PLR.dur||0;
    if(dur&&Math.abs(dur-PLR.dur)>0.5) PLR.dur=dur;
    const n=document.getElementById('pnow'), f=document.getElementById('pfill'), k=document.getElementById('pknob');
    if(n) n.textContent=fmtDur(t);
    const pct=dur?Math.round(t*100/dur):0;
    if(f) f.style.width=pct+'%'; if(k) k.style.left=pct+'%';
    const si=plrSiAt(t);
    if(si!==PLR.si){
      PLR.si=si;
      const box=document.getElementById('plyrics');
      if(box){
        box.querySelectorAll('.pline').forEach(el=>{
          const s=+el.dataset.si, d=Math.abs(s-si);
          el.className='pline '+(s===si?'now':(d<=1?'d2':'d1'));

}

/* ===== 课程离线包：按课程下载进 el2-content 缓存层（设备级，不依赖登录） ===== */
const CACHE_CONTENT='el2-content';
const DL={};                       /* 运行期进度缓存，避免每次渲染都读 localStorage */
const DLSTOP={};                   /* 每门课的暂停旗标：下载循环每步检查，不靠状态字段自欺 */
function dlMap(){ try{ return JSON.parse(localStorage.getItem(LS+'dl')||'{}'); }catch(e){ return {}; } }
function dlGet(id){ if(DL[id]) return DL[id]; const m=dlMap(); return m[id]||null; }
function dlSet(id,v){
  if(v===null){ delete DL[id]; const m=dlMap(); delete m[id]; try{ localStorage.setItem(LS+'dl',JSON.stringify(m)); }catch(e){} return; }
  DL[id]=v; const m=dlMap(); m[id]=v; try{ localStorage.setItem(LS+'dl',JSON.stringify(m)); }catch(e){}
}
function dlPct(id){ const s=dlGet(id); if(!s||!s.total) return 0; return Math.max(0,Math.min(100,Math.round(s.done*100/s.total))); }
function courseFiles(c){
  const n=+c.lessons||0, out=[];
  for(let i=1;i<=n;i++){ const k=String(i).padStart(c.pad||2,'0');
    if(c.dataPat) out.push(c.dataPat.replace('{NN}',k));
    if(c.audioPat) out.push(c.audioPat.replace('{NN}',k)); }
  return out;
}
/* 旧版一键离线包（只存了 el2_offline 标记）→ 迁移成 nce2 已就绪，不让老用户白下一遍 */
(function(){ try{
  if(localStorage.getItem('el2_offline')&&!dlGet('nce2')){
    const n=courseFiles(catCourse('nce2')||{lessons:96}).length;
    dlSet('nce2',{done:n,total:n,state:'done'});
  }
}catch(e){} })();
async function dlCourse(id){
  const c=catCourse(id); if(!c||!c.ready) return;
  const prev=dlGet(id); if(prev&&prev.state==='run'&&!DLSTOP[id]) return;
  const files=courseFiles(c);
  const st={done:(prev&&prev.state!=='done')?Math.min(prev.done||0,files.length):0,total:files.length,state:'run'};
  DLSTOP[id]=0; dlSet(id,st); paintDl(id);
  /* 申请持久化存储，避免系统清理掉几十 MB 的离线包 */
  if(navigator.storage&&navigator.storage.persist){ try{ navigator.storage.persist(); }catch(e){} }
  let cache; try{ cache=await caches.open(CACHE_CONTENT); }
  catch(e){ dlSet(id,Object.assign({},st,{state:'fail'})); paintDl(id); return; }
  for(let i=st.done;i<files.length;i++){
    if(DLSTOP[id]) return;                                       /* 暂停 / 已移除 → 立即停 */
    try{
      const m=await cache.match(files[i]);
      if(!m){ const r=await fetch(files[i]); if(r&&r.ok) await cache.put(files[i],r); }
    }catch(e){}
    if(DLSTOP[id]) return;                                       /* 在途请求期间被暂停 → 不覆盖暂停态 */
    st.done=i+1; dlSet(id,st);
    if(i%4===0||i===files.length-1) paintDl(id);
  }
  dlSet(id,{done:files.length,total:files.length,state:'done'});
  paintDl(id);
  toast(c.name+' 离线包下载完成 ✓');
}
function dlPause(id){
  const s=dlGet(id); if(s&&s.state==='run'){ DLSTOP[id]=1; dlSet(id,Object.assign({},s,{state:'pause'})); }
  paintDl(id);
}

  dlPause(id);
  try{ const cache=await caches.open(CACHE_CONTENT);
    for(const f of courseFiles(c)){ try{ await cache.delete(f); }catch(e){} } }catch(e){}
  dlSet(id,null);

}

    const st=dlGet(c.id);
    if(myCourses().indexOf(c.id)<0){ addCourse(c.id); dlCourse(c.id); toast('已加入「'+c.name+'」· 正在后台下载'); return; }  /* 添加即下载 */
    if(st&&st.state==='run'){ dlPause(c.id); return; }                           /* 下载中 → 暂停 */
    if(st&&st.state==='done'){ location.hash='#/c/'+c.id; return; }              /* 就绪 → 打开 */
    dlCourse(c.id); return;                                                      /* 待下载/暂停 → 续传 */
  }
  if(act==='addc'){ addCourse(el.dataset.c); dlCourse(el.dataset.c); return; }
  if(act==='dlc'){ dlCourse(el.dataset.c); return; }
  if(act==='pausec'){ dlPause(el.dataset.c); return; }
  if(act==='rmc'){ rmCourse(el.dataset.c); return; }
  if(act==='codego'){
    const inp=document.getElementById('codeIn');
    const code=(inp?inp.value:'').trim().toUpperCase();
    const hit=((CATALOG.codes)||[]).filter(x=>String(x.code).toUpperCase()===code)[0];
    if(!hit){ alert('课程码无效，请核对后重试'); return; }
    const ids=(hit.add||[]).filter(id=>{ const c=catCourse(id); return !!(c&&c.ready); });
    if(!ids.length){ alert('这个课程码对应的课程还在筹备中'); return; }
    ids.forEach(id=>{ addCourse(id); dlCourse(id); });
    toast('已加入我的课程 · 正在后台下载');
    renderStore();
    return;
  }
  if(act==='melogin'){ if(window.el2OpenLogin) window.el2OpenLogin(); return; }
  if(act==='logout'){ localStorage.removeItem('el2_session'); location.replace('login.html'); return; }
  if(act==='revsh'){ CUR.shReveal=!CUR.shReveal; renderLesson(); return; }
  if(act==='retellhint'){ CUR.retellHint=!CUR.retellHint; renderLesson(); return; }
  if(act==='tipq'){ const dEl=document.getElementById('tipd-'+el.dataset.tk); if(dEl) dEl.style.display=dEl.style.display==='none'?'block':'none'; return; }
  if(act==='hardf'){ HARDF=el.dataset.v||'all';
    if((location.hash||'').startsWith('#/hard')) renderHard();
    else if((location.hash||'').startsWith('#/cards')) renderCards();
    return;
  }
  if(act==='cardok'||act==='cardno'){
    const hard=hardAll();
    const cid=el.dataset.c||DEF_COURSE, no=+el.dataset.no, si=+el.dataset.i;
    const it=hard.filter(x=>(x.cid||DEF_COURSE)===cid&&x.no===no&&x.i===si)[0]; if(!it) return;
    it.due = Date.now() + (act==='cardok'?3*864e5:12*36e5);
    store.setHard(hard);
    const cd=el.closest('.card'); cd.classList.remove('flip'); cd.style.opacity=.4; cd.style.pointerEvents='none';
    return;
  }
  if(act==='flip'){ el.classList.toggle('flip'); }
  else if(act==='goSent'){
    const c = el.dataset.c||DEF_COURSE;
    location.hash=lessonHref(+el.dataset.no,c);
    CUR.afterRender=()=>{ prog(+el.dataset.no,c).stage=0; renderLesson(); };
  }
  else if(act==='unstar'){
    const cid=el.dataset.c||DEF_COURSE, no=+el.dataset.no, si=+el.dataset.i;
    store.setHard(hardAll().filter(x=>!((x.cid||DEF_COURSE)===cid&&x.no===no&&x.i===si)));
    const o=progOf(cid)[no];
    if(o&&o.hard){ const k=o.hard.indexOf(si); if(k>=0){ o.hard.splice(k,1); saveProgress(); } }
    renderHard();
  }
  else if(act==='cardplay'){ (async()=>{ const d=await loadLesson(+el.dataset.no, el.dataset.c);
      const s=d.sentences[+el.dataset.i]; if(s) playSeg(s.t,s.t2,null,audioSrcOf(d.audio)); })(); }
  else if(act==='exp'){
    const blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),v:3,progress:PROG,hard:hardAll(),stats:STATS},null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='nce2_loop备份_'+todayStr()+'.json'; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  }
  else if(act==='imp'){ $('#impFile').click(); }
  else if(act==='clr'){
    if(!confirm('确定清空全部学习记录？（课程文件不受影响）')) return;
    if(!confirm('再次确认：此操作不可恢复！')) return;
    PROG={_v:3,courses:{}}; STATS={playSec:0,shadowN:0,recN:0,days:{}}; store.setHard([]);
    saveProgress(); saveStats(); renderMe();
  }
});
document.addEventListener('change',e=>{
  if(e.target&&e.target.id==='impFile'&&e.target.files[0]){
    const fr=new FileReader();
    fr.onload=()=>{ try{ const d=JSON.parse(fr.result);
        if(d.progress){ PROG=migrateProg(d.progress); saveProgress(); }   /* 旧格式备份也能导入 */
        if(d.hard){ const a=d.hard.map(x=>Object.assign({cid:DEF_COURSE},x)); store.setHard(a); }
        if(d.stats){ STATS=Object.assign({playSec:0,shadowN:0,recN:0,days:{}},d.stats); saveStats(); }
        alert('已导入'); location.hash='#/home'; router();
      }catch(err){ alert('导入失败：'+err.message); } };
    fr.readAsText(e.target.files[0]);
  }
});

/* ================= 启动 ================= */
/* 真实性校验：标记说「已就绪」不算数，抽 3 个文件确认缓存里真有（防系统清缓存后界面说谎） */
async function verifyDl(id){
  const c=catCourse(id), s=dlGet(id); if(!c||!s||s.state!=='done') return;
  const files=courseFiles(c);
  const picks=[files[0],files[Math.floor(files.length/2)],files[files.length-1]].filter(Boolean);
  try{
    const cache=await caches.open(CACHE_CONTENT);
    for(const f of picks){
      const m=await cache.match(f);
      if(!m){ dlSet(id,Object.assign({},s,{state:'pause',done:0})); return; }
    }
  }catch(e){}
}
async function verifyAll(){ for(const id of myCourses()){ await verifyDl(id); } }
/* 上次没下完（切后台/杀进程）的课程，回来自动续传 */
function resumeDl(){
  setTimeout(()=>{ myCourses().forEach(id=>{
    const s=dlGet(id); if(s&&s.state==='run') dlCourse(id);
  }); }, 1200);
}
hardAll();                                 /* 难句本补 cid（v3 迁移），顺手落盘 */
router();                                  /* 先用内嵌清单渲染，秒开 */
loadCatalog().then(verifyAll).then(()=>{ router(); resumeDl(); }).catch(()=>{});
}
</script>
<script>
/* ===== PWA 安装引导：安卓 beforeinstallprompt 弹横幅（可触发系统安装框）；iOS 弹「分享→添加到主屏幕」分步提示 ===== */
(function(){
  var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  if (standalone) return;                                   // 已安装，不打扰
  var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var KEY = 'el2_install_hide';
  function canShow(){ try{ var t = +localStorage.getItem(KEY) || 0; return Date.now() > t; }catch(e){ return true; } }
  function hide(days){ try{ localStorage.setItem(KEY, String(Date.now() + days * 864e5)); }catch(e){} }
  function build(title, body, okText, onOk){
    var wrap = document.createElement('div');
    wrap.style.cssText = 'position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:999;'
      + 'background:#fff;border:1.5px solid #E9ECEF;border-radius:16px;box-shadow:0 10px 30px rgba(33,37,41,.18);padding:14px 16px;';
    wrap.innerHTML = '<div style="display:flex;gap:12px;align-items:flex-start">'
      + '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#3B5BDB" stroke-width="2" style="flex:0 0 34px;margin-top:2px">'
      + '<rect x="5" y="2" width="14" height="20" rx="3"/><path d="M9 18h6"/></svg>'
      + '<div style="flex:1"><div style="font-weight:700;font-size:15px;color:#212529">' + title + '</div>'
      + '<div style="font-size:13px;color:#6C757D;line-height:1.55;margin-top:3px">' + body + '</div></div></div>'
      + '<div style="display:flex;gap:10px;margin-top:10px">'
      + '<button id="pwaOk" style="flex:1;min-height:50px;border:0;border-radius:12px;background:#3B5BDB;color:#fff;font-size:15px;font-weight:700;cursor:pointer">' + okText + '</button>'
      + '<button id="pwaNo" style="min-width:88px;min-height:50px;border:1.5px solid #E9ECEF;border-radius:12px;background:#fff;color:#6C757D;font-size:14px;cursor:pointer">暂不</button></div>';
    document.body.appendChild(wrap);
    wrap.querySelector('#pwaOk').addEventListener('click', function(){ hide(365); wrap.remove(); if (onOk) onOk(); });
    wrap.querySelector('#pwaNo').addEventListener('click', function(){ hide(7); wrap.remove(); });
  }
  var deferred = null;
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault(); deferred = e;
    if (canShow()) build('安装 NCE2 Loop 到桌面', '像 App 一样全屏启动，听过一遍的课文离线也能学。', '立即安装', function(){
      if (deferred) { deferred.prompt(); deferred = null; }
    });
  });
  var isAndroid=/android/i.test(navigator.userAgent);
  var hasInstallAPI='onbeforeinstallprompt' in window;
  var isHuawei=/HuaweiBrowser|HarmonyOS|HUAWEI/i.test(navigator.userAgent);
  var androidNoChrome=isAndroid && !/Chrome\/|Edg\/|SamsungBrowser/i.test(navigator.userAgent);
  if ((isHuawei || androidNoChrome) && canShow()) {
    window.addEventListener('load', function(){
      setTimeout(function(){
        if (canShow()) build('添加到桌面（2 步）',
          '安卓浏览器不会自动弹安装框：① 点浏览器右上角「⋮」或底部「我的」打开菜单 ② 选「添加到桌面 / 添加到主屏幕」。完成后从桌面图标全屏进入，听课更流畅。',
          '知道了', null);
      }, 1500);
    });
  }
  if (isIOS && canShow()) {
    window.addEventListener('load', function(){
      setTimeout(function(){
        if (canShow()) build('添加到主屏幕（2 步）',
          'iOS 不会自动弹安装框：① 点浏览器底部的「分享」按钮 ② 在列表里选「添加到主屏幕」。完成后从桌面图标全屏进入。',
          '知道了', null);
      }, 1500);
    });
  }
})();
/* Service Worker 注册（离线学习） */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>

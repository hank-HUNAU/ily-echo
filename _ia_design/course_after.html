<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
:root{--ink:#212529;--sub:#6C757D;--line:#E9ECEF;--card:#fff;--bg:#F5F6F8;
 --focus:#0B8A5F;--brand:#10B981;--brandSoft:#E6F7F0;--bad:#B04A43;--warn:#C08A3E;
 /* 兼容旧别名 → 收敛到绿系 */
 --acc:var(--focus);--accBtn:var(--focus);--ok:var(--brand);--badOld:#E03131;
 --stage1:var(--brand);--stage2:var(--focus);--stage3:var(--brand);--stage4:var(--focus)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* ===== 全站隐藏滚动条（APP 视感，2026-11-21 定）=====
   只去掉轨道/滑块，滚动能力完整保留：触摸拖动、滚轮、键盘 PageDown、拖拽进度条照常。
   scrollbar-width（Firefox / 新 Chromium）+ ::-webkit-scrollbar（Safari / 旧 Chromium）双写。 */
*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{width:0;height:0;display:none}
/* 内层滚动容器：iOS 惯性滚动（滚动条已隐藏，不额外加 overscroll-behavior，避免内层不再把惯性交给页面） */
.plyrics,.kstage,.card .b,.hchips,.lbooks,.lcaps{-webkit-overflow-scrolling:touch}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
 background:var(--bg);color:var(--ink);font-size:16px;line-height:1.6;font-variant-numeric:tabular-nums;touch-action:manipulation;padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:880px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) calc(14px + env(safe-area-inset-right,0px)) 20px calc(14px + env(safe-area-inset-left,0px))}
h1{font-size:24px;margin:0}
h2{font-size:18px;margin:0 0 10px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:14px;touch-action:pan-y}
.tip{color:var(--sub);font-size:15px;margin:0 0 10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;
 padding:12px 20px;font-size:15px;font-family:inherit;cursor:pointer;background:var(--accBtn);color:#fff;min-height:52px}
.btn.g{background:#F1F3F5;color:var(--ink);border:1px solid var(--line)}
.btn.ok{background:var(--ok)} .btn.rd{background:var(--bad)}
.btn.sm{padding:7px 12px;min-height:50px;font-size:14px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:default}
.btn .ic{width:20px;height:20px;display:block}
/* 轻提示 toast */
#el2toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:900;background:rgba(33,37,41,.92);color:#fff;font-size:14px;padding:10px 18px;border-radius:999px;max-width:86vw;pointer-events:none;opacity:0;transition:opacity .25s}
#el2toast.on{opacity:1}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;background:var(--brandSoft);color:var(--focus)}
.tag{display:inline-block;border-radius:6px;padding:0 6px;font-size:13px;background:var(--brandSoft);color:var(--focus);margin-right:4px}
.tag.w{background:#E6F7F0;color:#0B8A5F}.tag.v{background:#E6F7F0;color:#0B8A5F}.tag.d{background:#FFF4E6;color:#8A5E22}
.item{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px dashed var(--line)}
.item:last-child{border-bottom:0}
.item .tt{flex:1;min-width:0}
.item .meta{font-size:14px;color:var(--sub)}
.play{flex:0 0 52px;width:52px;height:52px;border-radius:50%;border:0;background:var(--accBtn);color:#fff;font-size:15px;cursor:pointer}
.play.on{background:var(--bad)}
.ck{width:22px;height:22px;accent-color:var(--ok)}
.late{color:var(--bad);font-weight:600}
.empty{color:var(--sub);text-align:center;padding:10px 0;font-size:14px}
/* 课程网格 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
.cell{border:1px solid var(--line);border-radius:12px;background:#fff;text-align:center;padding:8px 2px;cursor:pointer;position:relative}
.cell b{font-size:16px;display:block}
.cell span{font-size:12px;color:var(--sub);display:block}
.cell.done{border-color:var(--ok);background:#F0FFF9}
.cell.doing{border-color:var(--brand);background:var(--brandSoft)}
.cell.due::after{content:"";position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.cell.miss span{color:var(--bad)}
/* 底部导航 */
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);
 display:flex;z-index:30;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
nav.tabs a{flex:1;text-align:center;padding:9px 0 8px;font-size:14px;color:var(--sub);text-decoration:none;min-height:56px}
nav.tabs a{position:relative}
nav.tabs a .bdg{position:absolute;top:6px;left:calc(50% + 4px);width:9px;height:9px;border-radius:50%;background:#E03131;border:1.5px solid #fff}
nav.tabs a svg{width:26px;height:26px;display:block;margin:0 auto 2px}
nav.tabs a.on{color:var(--focus)}
/* 五 tab：居中听单＝凸起圆钮（56px、凸出16、白描边环4、常亮无选中态） */
nav.tabs .fab{flex:1;position:relative;pointer-events:none}
nav.tabs .fabbtn{position:absolute;left:50%;top:-16px;transform:translateX(-50%);width:56px;height:56px;border-radius:50%;
 background:var(--brand);border:4px solid #fff;display:flex;align-items:center;justify-content:center;pointer-events:auto;cursor:pointer}
nav.tabs .fabbtn svg{width:26px;height:26px;margin:0;stroke:#fff}
/* 句子列表 */
.sent{display:flex;align-items:flex-start;gap:10px;padding:12px 4px;border-bottom:1px dashed var(--line)}
.sent.cur{background:var(--brandSoft);border-radius:10px}
.sent .en{font-family:Georgia,"Times New Roman",serif;font-size:18px;line-height:1.7}
.sent .zh{color:var(--sub);font-size:17px;line-height:1.65}
.sent .idx{flex:0 0 26px;color:var(--sub);font-size:14px;padding-top:3px}
.item .tt .en{font-family:Georgia,"Times New Roman",serif;font-size:18px;line-height:1.55}
.star{background:none;border:0;font-size:28px;color:#CED4DA;cursor:pointer;padding:0;width:50px;height:50px;flex:0 0 50px;display:inline-flex;align-items:center;justify-content:center}
.star.on{color:var(--warn)}
.detail{background:var(--brandSoft);border-radius:12px;padding:10px 12px;margin:6px 0;font-size:15px;color:var(--focus)}
.detail .ch{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:8px;padding:3px 9px;margin:2px 3px;font-size:14px}
.detail .ch i{font-style:normal;color:var(--sub);font-size:12px;margin-left:4px}
.blur{filter:blur(7px);transition:filter .3s;user-select:none}
/* 阶段条 */
.stepper{display:flex;gap:6px;margin:12px 0}
.tipq{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);background:#fff;color:var(--sub);font-size:13px;font-weight:700;cursor:pointer;vertical-align:middle;flex:0 0 26px}
.tipd .tip{background:#F8F9FC;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-top:6px}
.bk2{width:56px;height:74px;border-radius:10px;object-fit:cover;display:block;flex:0 0 56px;border:0.5px solid var(--color-border-tertiary, #E9ECEF);background:#F1F3F5}
.blurred{filter:blur(9px);user-select:none;pointer-events:none;transition:filter .25s}
/* 课程中心 / 课程库 */
/* 顶栏：所有页面统一——吸顶、压住刘海安全区、内容从其下方滚过 */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:10px;
 margin:calc(-14px - env(safe-area-inset-top,0px)) calc(-14px - env(safe-area-inset-right,0px)) 6px calc(-14px - env(safe-area-inset-left,0px));
 padding:calc(14px + env(safe-area-inset-top,0px)) calc(14px + env(safe-area-inset-right,0px)) 10px calc(14px + env(safe-area-inset-left,0px));
 background:var(--bg);border-bottom:1px solid var(--line)}
.tbBack{flex:0 0 auto;min-width:52px;text-align:right;color:var(--accBtn);font-weight:600;text-decoration:none;font-size:15px;white-space:nowrap;padding:6px 0 6px 10px}
.ttitle{flex:1;min-width:0;font-size:18px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar h1{font-size:22px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbtn{border:1.5px solid var(--acc);color:var(--accBtn);background:#fff;border-radius:999px;padding:0 16px;height:46px;font-size:15px;font-family:inherit;cursor:pointer;white-space:nowrap}
.coGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.coCard{border:1px solid var(--line);border-radius:14px;background:#fff;padding:12px 10px 11px;text-align:center;position:relative;
 -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
/* 封面即状态（v4.2 屏 9）：全部彩色，不灰度化 —— dim 待下载压 10% / prog 下载中压 22% / lit 点亮 / fail 彩色+红环 */
.cover{position:relative;display:block;width:66px;height:88px;margin:0 auto 8px;border-radius:11px;overflow:hidden;background:#F1F3F5}
.cover .bkc{width:100%;height:100%;border-radius:11px;object-fit:cover;display:block;border:0.5px solid var(--line);background:#F1F3F5}
.cover.dim .bkc{filter:brightness(.9)}
.cover.prog .bkc{filter:brightness(.78)}
.cover.lit .bkc{filter:none}
.cover.fail .bkc{filter:brightness(.86) saturate(.85)}
.cover.soon .bkc{filter:brightness(.94) saturate(.9)}
.pring{position:absolute;inset:0;margin:auto;width:56px;height:56px;filter:drop-shadow(0 1px 4px rgba(0,0,0,.35))}
.pring .arc{transition:stroke-dashoffset .4s}
.cover.prog .pring{animation:ppulse 1.6s ease-in-out infinite}
@keyframes ppulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.ppct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.55);font-style:normal}
.ppct.rd{font-size:20px;color:var(--bad);text-shadow:0 1px 3px rgba(255,255,255,.7)}
.cover.fail .pring{animation:none}
/* 角标：待下载=线性下载箭头 / 已下载=品牌绿勾 */
.dlbadge{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.95);
 box-shadow:0 1px 3px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;color:var(--sub)}
.dlbadge svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.dlbadge.ok{background:var(--focus);color:#fff}
.coCard.off .coName{color:var(--sub)}
.stfoot{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--sub);padding:12px 4px 2px}
.coName{font-size:15px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 书名类文本一律单行：窄屏收缩省略，绝不跨行 */
.oneline{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 难句/卡片 的课程筛选 */
.hchips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.hchips::-webkit-scrollbar{display:none}
.hchip{flex:0 0 auto;min-height:44px;border:1.5px solid var(--line);background:#fff;color:var(--sub);border-radius:999px;padding:0 14px;font-size:14.5px;font-family:inherit;cursor:pointer}
.hchip.on{border-color:var(--acc);background:var(--acc);color:#fff}
.hchip i{font-style:normal;font-size:13px;opacity:.8;margin-left:3px}
.cap{font-size:12.5px;color:var(--sub);margin-top:10px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cap b{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;flex:0 0 7px}
.cap b.no{background:#CED4DA}
.codeRow{display:flex;gap:8px}
.codeRow input{flex:1;min-width:0;height:50px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;font-size:16px;outline:none;background:#FBFCFD;text-transform:uppercase}
.stepper .st{flex:1;text-align:center;font-size:15px;padding:11px 2px;border-radius:10px;background:#F1F3F5;color:var(--sub)}
.stepper .st.on{color:#fff;font-weight:600}
.stepper .st.ok{background:#E6FCF5;color:#087F5B}
.stepper .st.s0.on{background:var(--stage1)}.stepper .st.s1.on{background:var(--stage2)}
.stepper .st.s2.on{background:var(--stage3)}.stepper .st.s3.on{background:var(--stage4)}
/* 跟读台 */
.shadow{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px}
.shadow .big{font-size:19px;font-family:Georgia,serif;margin:8px 0}
.shadow .cnt{display:flex;gap:6px;align-items:center;margin:10px 0;flex-wrap:wrap}
.rec{width:64px;height:64px;border-radius:50%;border:0;background:var(--rd,#E03131);color:#fff;font-size:24px;cursor:pointer}
.rec.recording{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
.ab{display:flex;gap:8px;margin:10px 0}
.stars{font-size:24px;cursor:pointer;user-select:none;letter-spacing:4px}
.stars i{font-style:normal;color:#CED4DA}.stars i.on{color:var(--warn)}
.grade{font-size:14px;margin-top:6px}
.bar{height:8px;border-radius:999px;background:#EDF2F7;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.card{perspective:900px;min-height:190px;margin:10px 0}
.card .in{position:relative;width:100%;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}
.card.flip .in{transform:rotateY(180deg)}
.card .f,.card .b{backface-visibility:hidden;border-radius:16px;border:1px solid var(--line);
 display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;text-align:center}
.card .f{position:relative;background:#fff;min-height:190px}
.card .b{position:absolute;inset:0;background:var(--brandSoft);transform:rotateY(180deg);overflow-y:auto}
/* 闪卡背面三图标：语境重听 / 没记住 / 记住了 */
.cico{width:52px;height:52px;border-radius:50%;border:1.5px solid var(--line);background:#fff;
 display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;color:var(--accBtn);flex:0 0 52px}
.cico svg{width:24px;height:24px}
.cico.no{color:var(--bad);border-color:#F1BFC0;background:#FFF5F5}
.cico.ok{color:var(--ok);border-color:#B7E4CE;background:#F0FFF9}
.ring{width:110px}
.ring text{font-weight:700}
.foot{color:var(--sub);font-size:12px;text-align:center;margin-top:14px}
audio{width:100%}
/* ===== 听单 / 播放页（P1 静态骨架）===== */
.listen-page,.player-page{margin:calc(-14px - env(safe-area-inset-top,0px)) -14px 0;padding:0 0 calc(96px + env(safe-area-inset-bottom,0px));min-height:100vh;background:var(--bg)}
.player-page{display:flex;flex-direction:column}
.listen-page .lhead{padding:calc(14px + env(safe-area-inset-top,0px)) 18px 0;font-size:24px;color:var(--ink);letter-spacing:.5px}
.lbooks{display:flex;gap:7px;overflow-x:auto;padding:11px 18px 0;scrollbar-width:none}
.lbooks::-webkit-scrollbar{display:none}
.lcaps{display:flex;gap:6px;padding:10px 18px 12px;overflow-x:auto;scrollbar-width:none}
.lcaps::-webkit-scrollbar{display:none}
.lcap{flex:0 0 auto;font-size:12px;color:var(--sub);background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 13px}
.lcap.on{font-weight:600;color:var(--focus);background:var(--brandSoft);border-color:var(--brandSoft)}
.lcap,.lchip{font-family:inherit;cursor:pointer}
.lchip{flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;font-size:12.5px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 14px}
.lchip.on{color:#fff;background:var(--brand);border-color:var(--brand);font-weight:600}
.lchip.lock{color:#ADB5BD;border-color:#EDF0F2;cursor:default}
.lchip svg{width:11px;height:11px}
.lempty{font-size:13px;color:var(--sub);text-align:center;padding:14px 4px}
.lcard{margin:0 16px;background:#fff;border:0.5px solid var(--line);border-radius:16px;padding:13px}
.lcard .lplay{width:46px;height:46px;border-radius:50%;background:var(--brand);display:flex;align-items:center;justify-content:center;flex:0 0 46px}
.lcard .lplay svg{width:20px;height:20px}
.lnow{font-size:11px;color:var(--focus);font-weight:600;letter-spacing:.4px}
.lttl{font-size:15px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.ltime{font-size:11.5px;color:var(--sub);font-variant-numeric:tabular-nums}
.lbar{height:3px;background:#EDF0F2;border-radius:2px;margin-top:11px;position:relative}
.lbar i{position:absolute;left:0;top:0;height:3px;width:52%;background:var(--brand);border-radius:2px}
.lbar b{position:absolute;left:52%;top:-3px;width:9px;height:9px;border-radius:50%;background:var(--brand);margin-left:-4px}
.lmeta{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:11.5px;color:var(--sub)}
.lmeta em{color:var(--focus);font-style:normal}
.lpad{padding:14px 18px 7px;display:flex;align-items:baseline;justify-content:space-between}
.lpad span:first-child{font-size:11.5px;font-weight:600;color:var(--sub);letter-spacing:.4px}
.lpad span:last-child{font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums}
.lpacks{margin:0 16px;background:#fff;border:0.5px solid var(--line);border-radius:16px;overflow:hidden}
.lpack{display:flex;align-items:center}
.lsep{height:0.5px;background:var(--line);margin-left:66px}
.lbadge{width:42px;height:42px;border-radius:11px;background:var(--brandSoft);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:0 0 42px;color:var(--focus)}
.lbadge span{font-size:14px;font-weight:700;letter-spacing:.3px;line-height:1.1}
.lbadge.ref{background:#F1F3F5;color:var(--sub)}
.lbadge.ref small{font-size:8.5px;line-height:1.2}
.ldone{display:inline-flex;align-items:center;gap:5px;color:var(--focus);font-size:11px}
.ldone svg{width:13px;height:13px}
.lrun{display:inline-flex;align-items:center;gap:6px;color:var(--focus);font-size:11px;font-variant-numeric:tabular-nums}
.lrun i{width:34px;height:3px;background:#EDF0F2;border-radius:2px;display:block;position:relative}
.lrun i b{position:absolute;left:0;top:0;height:3px;background:var(--brand);border-radius:2px}
.ldl{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center}
.ldl svg{width:15px;height:15px;color:var(--focus)}
/* 播放页 */
.player-page .ptop{display:flex;align-items:center;justify-content:space-between;padding:calc(6px + env(safe-area-inset-top,0px)) 12px 0}
.ptop .pback,.ptop .pmore{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--ink);text-decoration:none;position:relative;border:0;background:none;padding:0;font-family:inherit;cursor:pointer}
.ptop svg{width:22px;height:22px}
.ptop .pmore i{position:absolute;top:3px;right:3px;min-width:15px;height:15px;border-radius:8px;background:var(--brand);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;padding:0 3px;font-style:normal}
.ptitle{text-align:center;padding:2px 44px 6px}
.ptitle b{font-size:18px;font-weight:600;color:var(--ink);line-height:1.3;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptitle div{font-size:11.5px;color:var(--sub);margin-top:2px}
.ptitle div span{color:var(--sub)}
.ptitle div em{color:var(--focus);font-style:normal}
.plyrics{position:relative;padding:22px 18px;display:flex;flex-direction:column;gap:15px;align-items:flex-start;min-height:260px;max-height:56vh;flex:1;overflow-y:auto;scrollbar-width:none;justify-content:flex-start;padding-bottom:44px}
.plyrics::-webkit-scrollbar{display:none}
.pline[data-si]{cursor:pointer}
.pfade{position:absolute;left:0;right:0;height:36px;z-index:2;pointer-events:none}
.pfade.top{top:0;background:linear-gradient(var(--bg),rgba(245,246,248,0))}
.pfade.bot{bottom:0;background:linear-gradient(rgba(245,246,248,0),var(--bg))}

.blind-hint{margin-top:10px;padding:10px 14px;background:#fff;border:1px dashed var(--line);border-radius:12px;color:var(--sub);font-size:14px}

.int-wrap{padding:2px 0}

.ankiZh{font-size:16px;line-height:1.6;color:var(--sub)}
.ankiFoot{display:flex;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--line);font-size:11.5px;color:var(--sub)}
.int-tip{text-align:center;font-size:11px;color:var(--sub);margin:8px 0}

.int-lang .seg span{padding:5px 12px;font-size:12px;color:var(--sub);cursor:pointer;background:#fff}
.int-lang .seg span.on{background:var(--brandSoft);color:var(--focus);font-weight:600}

.int-track b{position:absolute;top:-5px;width:14px;height:14px;border-radius:50%;background:var(--brand);border:2.5px solid #fff;margin-left:-7px}
.int-ctl{display:flex;align-items:center;justify-content:center;gap:26px;padding:10px 20px 4px;background:#fff;margin:0 16px;border-radius:0 0 14px 14px}
.int-mini{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:0;background:none;color:var(--brand);cursor:pointer}
.int-mini svg{width:26px;height:26px}
.int-play{width:56px;height:56px;border-radius:50%;background:var(--brand);border:0;display:flex;align-items:center;justify-content:center;cursor:pointer}

 font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 26px}
